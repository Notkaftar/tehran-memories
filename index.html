<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>نقشه خاطرات شهری تهران | انقلاب تا نوفل‌لوشاتو، ولیعصر تا فردوسی</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        :root {
            --pin-red: #e53935;
            --pin-red-dark: #b71c1c;
            --pin-navy: #0b1b45;
            --pin-navy-hover: #162f70;
            --pin-special: #b45309;
            --pin-special-light: #f59e0b;
            --ink-black: #111111;
            --paper-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e5e5e5;
            color: var(--ink-black);
        }

        /* Viewport wrapper that clips the rotated top-down map cleanly */
        #map-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #e5e5e5;
        }

        /* Oversized map container so top-down rotation (-5.5 deg) never shows empty corners */
        #map {
            position: absolute;
            top: -18%;
            left: -18%;
            width: 136%;
            height: 136%;
            background-color: #e5e5e5;
            z-index: 1;
            transform-origin: 50% 50%;
            transform: rotateZ(-5.5deg) scale(1.0);
        }

        /* Counter-rotate pins and popups so they always stand upright and crisp */
        .upright-counter-rotate {
            transform: rotateZ(5.5deg);
            transform-origin: bottom center;
        }

        /* Crisp Black & White Monochrome Filter on Satellite + Base Map Tiles (just like the original version) */
        .leaflet-tile-pane {
            filter: grayscale(100%) contrast(118%) brightness(102%);
            transition: opacity 0.35s ease;
        }

        /* Crisp AutoCAD-style vector linework rendering */
        .leaflet-overlay-pane svg path,
        .leaflet-cadBuildingsPane-pane svg path,
        .leaflet-cadFootwaysPane-pane svg path,
        .leaflet-cadRoadCasingPane-pane svg path,
        .leaflet-cadRoadFillPane-pane svg path {
            shape-rendering: geometricPrecision;
        }

        /* Cursor style when in "Add Pin" mode */
        .adding-pin-cursor #map,
        .adding-pin-cursor .leaflet-container {
            cursor: crosshair !important;
        }

        /* Remove default Leaflet popup styling for custom sketch diagram */
        .diagram-popup .leaflet-popup-content-wrapper {
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
            padding: 0 !important;
            border-radius: 0 !important;
        }
        .diagram-popup .leaflet-popup-content {
            margin: 0 !important;
            line-height: 1.4;
        }
        .diagram-popup .leaflet-popup-tip-container {
            display: none !important;
        }
        .diagram-popup.leaflet-popup {
            margin-bottom: 0 !important;
            pointer-events: auto;
        }

        /* Custom Pin Marker Containers */
        .custom-sketch-pin {
            background: transparent;
            border: none;
        }

        /* Red Memory Pin Styling */
        .pin-svg-wrapper {
            position: relative;
            width: 36px;
            height: 46px;
            transform-origin: 18px 44px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0px 4px 4px rgba(0, 0, 0, 0.35));
        }

        .pin-svg-wrapper:hover {
            transform: scale(1.16) translateY(-2px);
        }

        .pin-svg-wrapper.active-pin {
            transform: scale(1.18);
            filter: drop-shadow(0px 5px 8px rgba(229, 57, 53, 0.55));
        }

        /* Mini count badge on red memory pin */
        .pin-count-badge {
            position: absolute;
            top: -5px;
            left: -5px;
            background: #ffffff;
            color: #111111;
            border: 1.8px solid #111111;
            font-size: 10px;
            font-weight: 800;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 1px 1px 0 #111111;
        }

        /* Navy Screen Pin Styling */
        .screen-pin-wrapper {
            position: relative;
            width: 28px;
            height: 36px;
            transform-origin: 14px 34px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
            filter: drop-shadow(0px 3px 3px rgba(11, 27, 69, 0.35));
        }

        .screen-pin-wrapper:hover {
            transform: scale(1.18) translateY(-2px);
            filter: drop-shadow(0px 5px 6px rgba(11, 27, 69, 0.55));
        }

        .screen-pin-wrapper.active-screen-pin {
            transform: scale(1.22);
            filter: drop-shadow(0px 5px 9px rgba(11, 27, 69, 0.7));
        }

        /* Special Memory Pin Styling (Gold/Amber Star Pin for "خاطرات خاص" Layer) */
        .special-pin-wrapper {
            position: relative;
            width: 40px;
            height: 50px;
            transform-origin: 20px 48px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
            filter: drop-shadow(0px 4px 6px rgba(180, 83, 9, 0.45));
        }

        .special-pin-wrapper:hover {
            transform: scale(1.16) translateY(-2px);
            filter: drop-shadow(0px 6px 10px rgba(180, 83, 9, 0.65));
        }

        .special-pin-wrapper.active-pin {
            transform: scale(1.2);
            filter: drop-shadow(0px 6px 12px rgba(180, 83, 9, 0.75));
        }

        .special-pin-ring {
            position: absolute;
            bottom: -4px;
            left: 50%;
            width: 26px;
            height: 26px;
            margin-left: -13px;
            border: 2px solid var(--pin-special-light);
            border-radius: 50%;
            pointer-events: none;
            animation: screenPulse 2.2s ease-out infinite;
        }

        /* Count badge on Screen pin showing linked memory pins */
        .screen-count-badge {
            position: absolute;
            top: -5px;
            left: -6px;
            background: #ffffff;
            color: var(--pin-navy);
            border: 1.8px solid var(--pin-navy);
            font-size: 9.5px;
            font-weight: 800;
            min-width: 17px;
            height: 17px;
            padding: 0 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            box-shadow: 1px 1px 0 var(--pin-navy);
        }

        .screen-pin-wrapper.active-screen-pin .screen-count-badge {
            background: var(--pin-red);
            color: #ffffff;
            border-color: #111111;
            box-shadow: 1px 1px 0 #111111;
        }

        /* Subtle pulse ring around currently active Screen */
        .screen-active-ring {
            position: absolute;
            bottom: -4px;
            left: 50%;
            width: 24px;
            height: 24px;
            margin-left: -12px;
            border: 2px solid var(--pin-navy);
            border-radius: 50%;
            pointer-events: none;
            animation: screenPulse 1.7s ease-out infinite;
        }

        @keyframes screenPulse {
            0% { transform: scale(0.5); opacity: 0.9; }
            100% { transform: scale(1.9); opacity: 0; }
        }

        /* Pop-in animation when red memory pins appear under a Screen */
        @keyframes pinPopIn {
            0% { transform: scale(0.3) translateY(8px); opacity: 0; }
            75% { transform: scale(1.12) translateY(-2px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .pin-pop-in {
            animation: pinPopIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        /* Minimalist architectural toggle switch for Layers panel */
        .layer-switch {
            position: relative;
            width: 34px;
            height: 18px;
            border: 1.8px solid #111111;
            background-color: #e5e5e5;
            flex-shrink: 0;
            transition: background-color 0.18s ease;
        }

        .layer-switch::after {
            content: '';
            position: absolute;
            top: 1.5px;
            left: 2px;
            width: 11px;
            height: 11px;
            background-color: #111111;
            transition: transform 0.18s ease, background-color 0.18s ease;
        }

        .layer-switch.is-on::after {
            transform: translateX(15px);
            background-color: #ffffff;
        }

        .layer-switch.is-on.switch-navy {
            background-color: var(--pin-navy);
        }

        .layer-switch.is-on.switch-red {
            background-color: var(--pin-red);
        }

        .layer-switch.is-on.switch-special {
            background-color: var(--pin-special);
        }

        /* ============================================================================
           DIAGRAMMATIC CALLOUT POPUP (Exact match to hand-drawn sketch - Enlarged)
           Pin tip at bottom-left -> Diagonal line (/) -> Top Box -> Stacked Black Boxes
           ============================================================================ */
        .diagram-popup-anchor {
            transform: translateY(calc(100% - 54px)) rotateZ(5.5deg);
            transform-origin: 0px 52px;
        }

        .sketch-diagram-container {
            position: relative;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            direction: ltr;
            pointer-events: auto;
            user-select: text;
        }

        .sketch-connector-svg {
            width: 54px;
            height: 64px;
            flex-shrink: 0;
            overflow: visible;
            pointer-events: none;
            margin-right: -2px;
        }

        .sketch-boxes-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 410px;
            max-width: 82vw;
            max-height: min(64vh, calc(100vh - 175px));
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding: 2px 2px 8px 6px;
            direction: rtl;
        }

        .sketch-boxes-stack::-webkit-scrollbar {
            width: 6px;
        }
        .sketch-boxes-stack::-webkit-scrollbar-track {
            background: rgba(17, 17, 17, 0.08);
            border-radius: 3px;
        }
        .sketch-boxes-stack::-webkit-scrollbar-thumb {
            background: #111111;
            border-radius: 3px;
        }

        .sketch-box-red {
            background: #ffffff;
            border: 2.8px solid var(--pin-red);
            border-radius: 2px 4px 3px 2px;
            padding: 15px 17px;
            box-shadow: 5px 5px 0px rgba(229, 57, 53, 0.18);
            position: relative;
            flex-shrink: 0;
            transition: transform 0.15s ease;
        }

        .sketch-box-special {
            background: #fffdf7;
            border: 2.8px solid var(--pin-special);
            border-radius: 2px 4px 3px 2px;
            padding: 15px 17px;
            box-shadow: 5px 5px 0px rgba(180, 83, 9, 0.22);
            position: relative;
            flex-shrink: 0;
            transition: transform 0.15s ease;
        }

        .sketch-box-black {
            background: #ffffff;
            border: 2px solid var(--ink-black);
            border-radius: 2px 3px 4px 2px;
            padding: 13px 16px;
            box-shadow: 4px 4px 0px rgba(17, 17, 17, 0.14);
            position: relative;
            flex-shrink: 0;
            transition: transform 0.15s ease;
        }

        .sketch-wavy-divider {
            height: 7px;
            width: 100%;
            margin-top: 8px;
            opacity: 0.35;
        }

        .sketch-secondary-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Architectural brutalist buttons & panels */
        .arch-panel {
            background: #ffffff;
            border: 2px solid #111111;
            box-shadow: 4px 4px 0px #111111;
        }

        .arch-btn {
            background: #ffffff;
            color: #111111;
            border: 2px solid #111111;
            box-shadow: 2px 2px 0px #111111;
            transition: all 0.12s ease;
        }
        .arch-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #111111;
        }
        .arch-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #111111;
        }

        .arch-btn-red {
            background: var(--pin-red);
            color: #ffffff;
            border: 2px solid #111111;
            box-shadow: 3px 3px 0px #111111;
            transition: all 0.12s ease;
        }
        .arch-btn-red:hover {
            background: #d32f2f;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #111111;
        }
        .arch-btn-red.active-mode {
            background: #111111;
            color: #ffffff;
            border-color: var(--pin-red);
            box-shadow: 3px 3px 0px var(--pin-red);
        }

        @keyframes pulseRed {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .pulse-badge {
            animation: pulseRed 1.8s infinite;
        }
    </style>
</head>
<body class="select-none">

    <!-- =====================================================================
         TOP ARCHITECTURAL HEADER BAR (Minimalist Black, White, Navy & Red)
         ===================================================================== -->
    <header class="fixed top-3 right-3 left-3 z-[1000] pointer-events-none flex flex-col md:flex-row items-start md:items-center justify-between gap-2">
        
        <!-- Brand & Bounded Zone Info -->
        <div class="arch-panel px-3.5 py-2.5 pointer-events-auto flex items-center gap-3 max-w-full">
            <div class="w-8 h-9 flex-shrink-0 flex items-center justify-center bg-red-50 border border-black">
                <svg width="22" height="28" viewBox="0 0 36 46" fill="none">
                    <path d="M18 44 C18 44 31 26.5 31 16 C31 8.5 25.2 3 18 3 C10.8 3 5 8.5 5 16 C5 26.5 18 44 18 44 Z" 
                          fill="#e53935" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"/>
                    <circle cx="18" cy="15.5" r="4.5" fill="#ffffff" stroke="#111111" stroke-width="2"/>
                </svg>
            </div>
            <div>
                <div class="flex items-center gap-2 flex-wrap">
                    <h1 class="text-sm md:text-base font-extrabold tracking-tight text-black">
                        نقشه خاطرات شهری تهران
                    </h1>
                    <span class="text-[10px] font-bold bg-black text-white px-1.5 py-0.5">
                        پروژه حافظه جمعی
                    </span>
                </div>
                <p class="text-[11px] text-neutral-700 font-medium mt-0.5">
                    محدوده غرب ولیعصر تا میدان فردوسی | از خیابان انقلاب تا نوفل‌لوشاتو
                </p>
            </div>
        </div>

        <!-- Action Controls & Layers Dropdown -->
        <div class="flex flex-wrap items-center gap-2 pointer-events-auto">
            
            <!-- Add New Memory Pin Mode Toggle -->
            <button id="toggleAddPinBtn" onclick="toggleAddPinMode()" 
                class="arch-btn-red px-3.5 py-2 text-xs md:text-sm font-bold flex items-center gap-2 cursor-pointer">
                <span id="addPinBtnDot" class="w-2.5 h-2.5 rounded-full bg-white inline-block"></span>
                <span id="addPinBtnText">+ گذاشتن پین و ثبت خاطره</span>
            </button>

            <!-- Layers Dropdown Wrapper -->
            <div id="layersControlWrapper" class="relative">
                <button type="button" onclick="toggleLayersPanel(event)" 
                    class="arch-btn px-3 py-2 text-xs md:text-sm font-extrabold flex items-center gap-2 cursor-pointer">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <span>Layers</span>
                    <span id="activeLayersCountBadge" class="text-[10px] bg-black text-white px-1.5 py-0.5 font-bold">۳</span>
                </button>

                <!-- Layers Dropdown Panel -->
                <div id="layersPanel" class="hidden absolute left-0 md:left-auto md:right-0 mt-2 w-72 arch-panel p-2.5 z-[1200]">
                    <div class="flex items-center justify-between pb-2 mb-2 border-b border-neutral-200">
                        <span class="text-xs font-extrabold text-black">لایه‌های نقشه (Layers)</span>
                        <button type="button" onclick="toggleLayersPanel(event, false)" class="text-xs text-neutral-400 hover:text-black font-extrabold px-1 cursor-pointer">✕</button>
                    </div>

                    <div class="space-y-2">
                        <!-- Layer 1: Screens (33 Dark Navy Pins) -->
                        <button type="button" onclick="toggleLayer('screens')" 
                                class="w-full flex items-center justify-between gap-2 p-2 border border-neutral-300 hover:border-black bg-white transition-colors cursor-pointer text-right">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <span class="w-3.5 h-3.5 rounded-full flex-shrink-0 border-2 border-black" style="background-color: #0b1b45;"></span>
                                <div class="truncate">
                                    <div class="text-xs font-extrabold text-black leading-tight">Screens</div>
                                    <div class="text-[10px] text-neutral-500 font-medium mt-0.5">
                                        <span id="layerScreensCount">۳۳</span> نقطه اسکرین (پین سرمه‌ای)
                                    </div>
                                </div>
                            </div>
                            <span id="layerSwitch-screens" class="layer-switch is-on switch-navy"></span>
                        </button>

                        <!-- Layer 2: Special Memories Layer (Hana the Cat & Dried Chenar Tree) -->
                        <button type="button" onclick="toggleLayer('specialMemories')" 
                                class="w-full flex items-center justify-between gap-2 p-2 border border-amber-700/50 hover:border-black bg-amber-50/40 transition-colors cursor-pointer text-right">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <span class="w-3.5 h-3.5 rounded-full flex-shrink-0 border-2 border-black flex items-center justify-center text-[8px] text-white" style="background-color: #b45309;">★</span>
                                <div class="truncate">
                                    <div class="text-xs font-extrabold text-black leading-tight">خاطرات خاص</div>
                                    <div class="text-[10px] text-neutral-600 font-medium mt-0.5">
                                        گربه حنا و درخت چنار خشکیده (<span id="layerSpecialCount">۲</span> نقطه)
                                    </div>
                                </div>
                            </div>
                            <span id="layerSwitch-specialMemories" class="layer-switch is-on switch-special"></span>
                        </button>

                        <!-- Layer 3: Study Zone Red Boundary -->
                        <button type="button" onclick="toggleLayer('boundary')" 
                                class="w-full flex items-center justify-between gap-2 p-2 border border-neutral-300 hover:border-black bg-white transition-colors cursor-pointer text-right">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <span class="w-3.5 h-1 flex-shrink-0 bg-red-600"></span>
                                <div class="truncate">
                                    <div class="text-xs font-extrabold text-black leading-tight">مرز محدوده</div>
                                    <div class="text-[10px] text-neutral-500 font-medium mt-0.5">کادر قرمز محدوده مطالعه</div>
                                </div>
                            </div>
                            <span id="layerSwitch-boundary" class="layer-switch is-on switch-red"></span>
                        </button>

                        <!-- Layer 4: Show All Memories Override (Off by default so memories reveal per Screen) -->
                        <button type="button" onclick="toggleLayer('allMemories')" 
                                class="w-full flex items-center justify-between gap-2 p-2 border border-neutral-300 hover:border-black bg-white transition-colors cursor-pointer text-right">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <span class="w-3.5 h-3.5 rounded-full flex-shrink-0 border-2 border-black bg-red-600"></span>
                                <div class="truncate">
                                    <div class="text-xs font-extrabold text-black leading-tight">نمایش همه خاطرات</div>
                                    <div class="text-[10px] text-neutral-500 font-medium mt-0.5">در حالت خاموش فقط با کلیک روی اسکرین</div>
                                </div>
                            </div>
                            <span id="layerSwitch-allMemories" class="layer-switch switch-red"></span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Stats Panel -->
            <div class="arch-panel px-3 py-2 text-xs font-bold flex items-center gap-2.5">
                <span><strong id="statScreensCount" style="color: #0b1b45;">۰</strong> Screens</span>
                <span class="text-neutral-300">|</span>
                <span><strong id="statPinsCount" class="text-red-600">۰</strong> پین خاطره</span>
                <span class="text-neutral-300 hidden sm:inline">|</span>
                <span class="hidden sm:inline"><strong id="statMemoriesCount" class="text-black">۰</strong> خاطره</span>
                <button onclick="resetToDemoMemories()" 
                    class="text-[11px] text-neutral-500 hover:text-red-600 underline mr-1 cursor-pointer"
                    title="بازگردانی خاطرات دمو به حالت اولیه">
                    بازنشانی
                </button>
            </div>
        </div>
    </header>

    <!-- =====================================================================
         ACTIVE MODE BANNER (Shown when user is placing a pin)
         ===================================================================== -->
    <div id="modeInstructionBanner" 
         class="fixed top-24 md:top-20 left-1/2 -translate-x-1/2 z-[1000] pointer-events-none transition-all duration-200 opacity-0 -translate-y-2">
        <div class="bg-black text-white border-2 border-red-500 px-4 py-2 text-xs md:text-sm font-bold shadow-lg flex items-center gap-2.5">
            <span class="w-2.5 h-2.5 rounded-full bg-red-500 pulse-badge"></span>
            <span>هر جای محدوده کلیک کنید؛ خاطره به‌طور خودکار به نزدیک‌ترین Screen متصل می‌شود</span>
            <button onclick="toggleAddPinMode(false)" class="pointer-events-auto text-red-400 hover:text-white text-xs underline mr-2 cursor-pointer">لغو</button>
        </div>
    </div>

    <!-- =====================================================================
         ACTIVE SCREEN STATUS BAR (Shown when a navy Screen pin is selected)
         ===================================================================== -->
    <div id="activeScreenBanner"
         class="hidden fixed top-24 md:top-20 left-1/2 -translate-x-1/2 z-[990] pointer-events-auto">
        <div class="arch-panel px-3.5 py-2 flex items-center gap-3 text-xs" style="border-color: #0b1b45; box-shadow: 4px 4px 0 #0b1b45;">
            <span class="w-3 h-3 rounded-full flex-shrink-0 border border-black" style="background-color: #0b1b45;"></span>
            <div class="flex items-center gap-2 flex-wrap">
                <span id="activeScreenTitle" class="font-extrabold" style="color: #0b1b45;">Screen #۱</span>
                <span class="text-neutral-300">|</span>
                <span id="activeScreenCountText" class="font-bold text-black">۰ پین خاطره زیرمجموعه</span>

        /***********************************************************************
         * 3.5. NEAREST-SCREEN MATCHING ALGORITHM (HAVERSINE DISTANCE)
         ***********************************************************************/
        function getDistanceMeters(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const toRad = deg => deg * Math.PI / 180;
            const dLat = toRad(lat2 - lat1);
            const dLng = toRad(lng2 - lng1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function findNearestScreen(lat, lng) {
            let bestScreen = SCREEN_PINS_DATA[0];
            let minDist = Infinity;

            for (let i = 0; i < SCREEN_PINS_DATA.length; i++) {
                const s = SCREEN_PINS_DATA[i];
                const d = getDistanceMeters(lat, lng, s.lat, s.lng);
                if (d < minDist) {
                    minDist = d;
                    bestScreen = s;
                }
            }
            return { screen: bestScreen, distanceMeters: Math.round(minDist) };
        }

        function getScreenById(screenId) {
            return SCREEN_PINS_DATA.find(s => s.id === screenId) || null;
        }

        function getRegularPins() {
            return pinsData.filter(p => !p.isSpecial);
        }

        function getSpecialPins() {
            return pinsData.filter(p => p.isSpecial);
        }

        function getPinsForScreen(screenId) {
            return pinsData.filter(p => !p.isSpecial && p.screenId === screenId);
        }

        function ensurePinsLinkedToNearestScreen(list) {
            return list.map(pin => {
                const nearest = findNearestScreen(pin.lat, pin.lng);
                return {
                    ...pin,
                    screenId: nearest.screen.id
                };
            });
        }

        // IndexedDB persistent cache so real OSM SVG linework loads rapidly on repeat visits
        const CAD_CACHE_DB_NAME = 'tehran_memory_cad_cache_v1';
        const CAD_CACHE_STORE = 'cad_vectors';
        const CAD_CACHE_KEY = 'enqelab_ferdowsi_cad_v3';

        function openCadCacheDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    reject(new Error('IndexedDB unavailable'));
                    return;
                }
                const req = indexedDB.open(CAD_CACHE_DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(CAD_CACHE_STORE)) {
                        db.createObjectStore(CAD_CACHE_STORE);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function getCachedOsmCadData() {
            try {
                const db = await openCadCacheDB();
                return await new Promise((resolve) => {
                    const tx = db.transaction(CAD_CACHE_STORE, 'readonly');
                    const store = tx.objectStore(CAD_CACHE_STORE);
                    const req = store.get(CAD_CACHE_KEY);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => resolve(null);
                });
            } catch (e) {
                return null;
            }
        }

        async function saveCachedOsmCadData(dataset) {
            try {
                const db = await openCadCacheDB();
                await new Promise((resolve) => {
                    const tx = db.transaction(CAD_CACHE_STORE, 'readwrite');
                    tx.objectStore(CAD_CACHE_STORE).put(dataset, CAD_CACHE_KEY);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                });
            } catch (e) {
                // Ignore quota or private-mode errors
            }
        }

        function loadPinsFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        const validInside = parsed.filter(p => isPointInsideStudyPolygon(p.lat, p.lng));
                        pinsData = ensurePinsLinkedToNearestScreen(validInside);
                        return;
                    }
                }
            } catch (e) {
                console.warn('Storage read fallback to demo pins:', e);
            }
            pinsData = ensurePinsLinkedToNearestScreen(JSON.parse(JSON.stringify(DEFAULT_DEMO_PINS)));
            savePinsToStorage();
        }

        function savePinsToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(pinsData));
            } catch (e) {
                console.warn('Could not persist to localStorage:', e);
            }
            updateStatsUI();
        }

            fetchRealOSMStreetsAndBuildings();

            renderScreenPins();

            // Live dashed preview line to nearest Screen while moving mouse in Add Pin Mode
            map.on('mousemove', (e) => {
                if (!isAddPinMode || tempNewMarker) {

                }
                if (!isPointInsideStudyPolygon(e.latlng.lat, e.latlng.lng)) {

                }

                const latlngs = [
                    [nearest.screen.lat, nearest.screen.lng],

                ];
                if (hoverNearestLinkLine) {
                    hoverNearestLinkLine.setLatLngs(latlngs);

            });

            map.on('mouseout', () => {
                clearHoverNearestLink();
            });

            // Click on map: place pin if in Add Pin Mode, otherwise close current popup
            map.on('click', (e) => {
                if (isAddPinMode) {
                    if (!isPointInsideStudyPolygon(e.latlng.lat, e.latlng.lng)) {
                        showToast('لطفاً پین را فقط داخل محدوده خط قرمز قرار دهید.');
                        return;
                    }
                    openNewPinCreationPopup(e.latlng.lat, e.latlng.lng);
                } else {
                    closeCurrentPopup(true);
                }
            });

            // Double click inside red boundary to place a new memory pin
            map.on('dblclick', (e) => {
                if (e.originalEvent) e.originalEvent.preventDefault();
                if (!isPointInsideStudyPolygon(e.latlng.lat, e.latlng.lng)) {
                    showToast('ثبت خاطره فقط داخل محدوده مشخص‌شده با کادر قرمز مجاز است.');
                    return;
                }
                openNewPinCreationPopup(e.latlng.lat, e.latlng.lng);
            });

            // Dynamically scale CAD road and building stroke weights on zoom
            map.on('zoomend', () => {
                updateCadStrokeWidths();
            });
        }

        function isPointInsideStudyPolygon(lat, lng) {
            let inside = false;
            const poly = STUDY_POLYGON_LATLNG;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                const yi = poly[i][0], xi = poly[i][1];
                const yj = poly[j][0], xj = poly[j][1];
                const intersect = ((yi > lat) !== (yj > lat)) &&
                    (lng < (xj - xi) * (lat - yi) / ((yj - yi) || 1e-12) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function fitMapToScreenshotFrame(animate = true) {
            map.fitBounds(STUDY_BOUNDS_LATLNG, {
                paddingTopLeft: [45, 75],
                paddingBottomRight: [45, 65],
                animate: animate
            });
        }

        /***********************************************************************
         * 5. FAST PROGRESSIVE & BATCHED OPENSTREETMAP CAD LINEWORK RENDERING
         ***********************************************************************/
        function getRoadWidthsForZoom(category, zoom) {
            const scale = zoom <= 15 ? 0.72 : (zoom === 16 ? 1.0 : (zoom === 17 ? 1.45 : (zoom === 18 ? 2.1 : 2.8)));
            const base = {
                major:  { casing: 8.6, fill: 6.4 },
                medium: { casing: 6.0, fill: 4.2 },
                minor:  { casing: 4.0, fill: 2.4 },
                alley:  { casing: 2.6, fill: 1.3 }
            }[category] || { casing: 2.6, fill: 1.3 };

            return {
                casingWeight: +(base.casing * scale).toFixed(2),
                fillWeight: +Math.max(0.8, base.fill * scale).toFixed(2)
            };
        }

        function updateCadStrokeWidths() {
            if (!map) return;
            const currentZoom = map.getZoom();
            osmRoadLayersMeta.forEach(({ casing, fill, category }) => {
                const { casingWeight, fillWeight } = getRoadWidthsForZoom(category, currentZoom);
                casing.setStyle({ weight: casingWeight });
                fill.setStyle({ weight: fillWeight });
            });
            const bWeight = currentZoom >= 18 ? 0.95 : (currentZoom >= 17 ? 0.8 : 0.65);
            osmBuildingLayers.forEach(layer => {
                layer.setStyle({ weight: bWeight });
            });
        }

        function renderStreetsDataset(roads, footways) {
            if (!map) return;
            const currentZoom = map.getZoom();

            osmFootwaysLayerGroup.clearLayers();
            osmStreetsCasingGroup.clearLayers();
            osmStreetsFillGroup.clearLayers();
            osmRoadLayersMeta = [];

            // Batch footways & walls into at most 2 SVG MultiPolylines (solid & dashed)
            const solidFootways = [];
            const dashedFootways = [];
            (footways || []).forEach(fw => {
                if (fw.dashed) dashedFootways.push(fw.coords);
                else solidFootways.push(fw.coords);
            });

            if (solidFootways.length > 0) {
                L.polyline(solidFootways, {
                    pane: 'cadFootwaysPane',
                    color: '#222222',
                    weight: 0.8,
                    opacity: 0.72,
                    smoothFactor: 0.6,
                    interactive: false
                }).addTo(osmFootwaysLayerGroup);
            }
            if (dashedFootways.length > 0) {
                L.polyline(dashedFootways, {
                    pane: 'cadFootwaysPane',
                    color: '#222222',
                    weight: 0.8,
                    opacity: 0.72,
                    dashArray: '2, 2',
                    smoothFactor: 0.6,
                    interactive: false
                }).addTo(osmFootwaysLayerGroup);
            }

            // Group roads by hierarchy and draw each category as 1 MultiPolyline casing + 1 MultiPolyline fill
            const roadsByCategory = { alley: [], minor: [], medium: [], major: [] };
            (roads || []).forEach(rd => {
                const bucket = roadsByCategory[rd.category] || roadsByCategory.alley;
                bucket.push(rd.coords);
            });

            const drawOrder = ['alley', 'minor', 'medium', 'major'];
            drawOrder.forEach(category => {
                const coordsList = roadsByCategory[category];
                if (!coordsList || coordsList.length === 0) return;

                const { casingWeight, fillWeight } = getRoadWidthsForZoom(category, currentZoom);

                const casingLine = L.polyline(coordsList, {
                    pane: 'cadRoadCasingPane',
                    color: '#141414',
                    weight: casingWeight,
                    opacity: 0.86,
                    lineCap: 'round',
                    lineJoin: 'round',
                    smoothFactor: 0.5,
                    interactive: false
                }).addTo(osmStreetsCasingGroup);

                const fillLine = L.polyline(coordsList, {
                    pane: 'cadRoadFillPane',
                    color: '#f2f2f2',
                    weight: fillWeight,
                    opacity: 0.78,
                    lineCap: 'round',
                    lineJoin: 'round',
                    smoothFactor: 0.5,
                    interactive: false
                }).addTo(osmStreetsFillGroup);

                osmRoadLayersMeta.push({ casing: casingLine, fill: fillLine, category });
            });
        }

        function renderBuildingsDataset(buildings) {
            if (!map) return;
            const currentZoom = map.getZoom();
            const bWeight = currentZoom >= 18 ? 0.95 : (currentZoom >= 17 ? 0.8 : 0.65);

            osmBuildingsLayerGroup.clearLayers();
            osmBuildingLayers = [];

            // Batch building footprints with translucent fill so the B&W satellite imagery shines cleanly underneath
            const list = buildings || [];
            const BATCH_SIZE = 400;
            for (let i = 0; i < list.length; i += BATCH_SIZE) {
                const multiPolyCoords = list.slice(i, i + BATCH_SIZE).map(ring => [ring]);
                const bBatch = L.polygon(multiPolyCoords, {
                    pane: 'cadBuildingsPane',
                    color: '#181818',
                    weight: bWeight,
                    opacity: 0.62,
                    fillColor: '#dcdcdc',
                    fillOpacity: 0.18,
                    fillRule: 'nonzero',
                    smoothFactor: 0.4,
                    interactive: false
                }).addTo(osmBuildingsLayerGroup);
                osmBuildingLayers.push(bBatch);
            }
        }

        function updateOsmLoadStatus(bCount, rCount, isPartial = false) {
            const statusEl = document.getElementById('osmStatusText');
            const dotEl = document.getElementById('osmDot');
            if (!statusEl || !dotEl) return;

            if (isPartial) {
                statusEl.textContent = `${rCount.toLocaleString('fa-IR')} خیابان و کوچه بارگذاری شد — در حال تکمیل پلان ساختمان‌ها...`;
                dotEl.className = 'w-1.5 h-1.5 rounded-full bg-amber-500 inline-block';
            } else {
                statusEl.textContent = `${bCount.toLocaleString('fa-IR')} پلان ساختمان و ${rCount.toLocaleString('fa-IR')} خیابان، کوچه و بن‌بست واقعی بارگذاری شد`;
                dotEl.className = 'w-1.5 h-1.5 rounded-full bg-red-600 inline-block';
            }
        }

        function renderCadGeometryDataset(dataset) {
            if (!dataset || !map) return;
            renderStreetsDataset(dataset.roads, dataset.footways);
            renderBuildingsDataset(dataset.buildings);
            updateOsmLoadStatus((dataset.buildings || []).length, (dataset.roads || []).length, false);
        }

        function parseStreetsOverpassGeom(osmData) {
            const roads = [];
            const footways = [];

            (osmData.elements || []).forEach(el => {
                if (el.type !== 'way' || !el.geometry || !el.tags) return;
                const coords = el.geometry.map(pt => [pt.lat, pt.lon]);
                if (coords.length < 2) return;

                if (el.tags.highway) {
                    const hw = el.tags.highway;
                    if (['footway', 'path', 'pedestrian', 'steps', 'cycleway'].includes(hw)) {
                        footways.push({ coords, dashed: hw === 'steps' });
                        return;
                    }

                    let category = 'alley';
                    if (['trunk', 'primary', 'trunk_link', 'primary_link'].includes(hw)) {
                        category = 'major';
                    } else if (['secondary', 'tertiary', 'secondary_link', 'tertiary_link'].includes(hw)) {
                        category = 'medium';
                    } else if (['residential', 'unclassified', 'living_street'].includes(hw)) {
                        category = 'minor';
                    }
                    roads.push({ category, coords });
                } else if (el.tags.barrier === 'wall') {
                    footways.push({ coords, dashed: false });
                }
            });

            return { roads, footways };
        }

        function parseBuildingsOverpassGeom(osmData) {
            const buildings = [];
            (osmData.elements || []).forEach(el => {
                if (el.type !== 'way' || !el.geometry || el.geometry.length < 3) return;
                buildings.push(el.geometry.map(pt => [pt.lat, pt.lon]));
            });
            return buildings;
        }

        function fetchFastestOverpassMirror(query, endpoints, timeoutMs = 15000) {
            return new Promise((resolve, reject) => {
                const controllers = endpoints.map(() => new AbortController());
                let failures = 0;
                let settled = false;

                const timer = setTimeout(() => {
                    if (!settled) {
                        settled = true;
                        controllers.forEach(c => c.abort());
                        reject(new Error('Overpass request timed out'));
                    }
                }, timeoutMs);

                endpoints.forEach((url, idx) => {
                    fetch(url, {
                        method: 'POST',
                        body: query,
                        signal: controllers[idx].signal
                    })
                        .then(res => {
                            if (!res.ok) throw new Error('HTTP ' + res.status);
                            return res.json();
                        })
                        .then(data => {
                            if (!data || !data.elements || data.elements.length === 0) {
                                throw new Error('Empty OSM payload');
                            }
                            if (!settled) {
                                settled = true;
                                clearTimeout(timer);
                                controllers.forEach((c, i) => { if (i !== idx) c.abort(); });
                                resolve(data);
                            }
                        })
                        .catch(() => {
                            failures++;
                            if (failures === endpoints.length && !settled) {
                                settled = true;
                                clearTimeout(timer);
                                reject(new Error('All Overpass mirrors failed'));
                            }
                        });
                });
            });
        }

        async function fetchRealOSMStreetsAndBuildings() {
            const cachedDataset = await getCachedOsmCadData();
            if (cachedDataset && cachedDataset.buildings && cachedDataset.buildings.length > 0) {
                renderCadGeometryDataset(cachedDataset);
                return;
            }

            // Tighter bounding box tailored to the study zone + rotated viewport margins (~30% less data)
            const bbox = '35.6930,51.4002,35.7038,51.4222';

            // Stage 1: Ultra-lightweight streets/alleys/walls query (returns in ~0.5–1.5s)
            const streetsQuery = `[out:json][timeout:14];(way["highway"](${bbox});way["barrier"="wall"](${bbox}););out tags geom qt;`;

            // Stage 2: Tagless building footprints query ("out geom qt" cuts JSON size by ~60%)
            const buildingsQuery = `[out:json][timeout:18];way["building"](${bbox});out geom qt;`;

            const streetEndpoints = [
                'https://overpass-api.de/api/interpreter',
                'https://overpass.kumi.systems/api/interpreter',
                'https://lz4.overpass-api.de/api/interpreter',
                'https://overpass.private.coffee/api/interpreter'
            ];

            // Rotated mirror order for Stage 2 so parallel requests avoid single-mirror rate limits
            const buildingEndpoints = [
                'https://overpass.kumi.systems/api/interpreter',
                'https://lz4.overpass-api.de/api/interpreter',
                'https://overpass.private.coffee/api/interpreter',
                'https://overpass-api.de/api/interpreter'
            ];

            let roads = [];
            let footways = [];
            let buildings = [];

            const streetsPromise = fetchFastestOverpassMirror(streetsQuery, streetEndpoints, 14000)
                .then(data => {
                    const parsed = parseStreetsOverpassGeom(data);
                    roads = parsed.roads;
                    footways = parsed.footways;
                    if (roads.length > 0) {
                        renderStreetsDataset(roads, footways);
                        if (buildings.length === 0) {
                            updateOsmLoadStatus(0, roads.length, true);
                        }
                    }
                })
                .catch(() => {});

            const buildingsPromise = new Promise(resolve => setTimeout(resolve, 120))
                .then(() => fetchFastestOverpassMirror(buildingsQuery, buildingEndpoints, 18000))
                .catch(() => fetchFastestOverpassMirror(buildingsQuery, streetEndpoints, 18000))
                .then(data => {
                    buildings = parseBuildingsOverpassGeom(data);
                    if (buildings.length > 0) {
                        renderBuildingsDataset(buildings);
                    }
                })
                .catch(() => {});

            await Promise.all([streetsPromise, buildingsPromise]);

            if (buildings.length > 0 || roads.length > 0) {
                updateOsmLoadStatus(buildings.length, roads.length, false);
                if (buildings.length > 0 && roads.length > 0) {
                    saveCachedOsmCadData({ buildings, roads, footways });
                }
            } else {
                const statusEl = document.getElementById('osmStatusText');
                const dotEl = document.getElementById('osmDot');
                if (statusEl && dotEl) {
                    statusEl.textContent = 'نقشه ماهواره‌ای سیاه‌وسفید فعال است';
                    dotEl.className = 'w-1.5 h-1.5 rounded-full bg-neutral-800 inline-block';
                }
            }
        }

        /***********************************************************************
         * 6. LAYERS SYSTEM, DARK NAVY "SCREENS" PINS & TOGGLE CONTROLS
         ***********************************************************************/
        function toggleLayersPanel(event, forceState) {
            if (event) event.stopPropagation();
            isLayersPanelOpen = typeof forceState === 'boolean' ? forceState : !isLayersPanelOpen;
            const panel = document.getElementById('layersPanel');
            if (!panel) return;
            if (isLayersPanelOpen) {
                panel.classList.remove('hidden');
            } else {
                panel.classList.add('hidden');
            }
        }

        function toggleLayer(layerKey) {
            if (!(layerKey in layersState)) return;
            layersState[layerKey] = !layersState[layerKey];

            if (layerKey === 'screens') {
                if (layersState.screens) {
                    if (!map.hasLayer(screensLayerGroup)) screensLayerGroup.addTo(map);
                } else {
                    if (map.hasLayer(screensLayerGroup)) map.removeLayer(screensLayerGroup);
                    deselectScreen();
                }
            } else if (layerKey === 'specialMemories') {
                if (layersState.specialMemories) {
                    if (!map.hasLayer(specialPinsLayerGroup)) specialPinsLayerGroup.addTo(map);
                    renderSpecialPins();
                } else {
                    const activePin = pinsData.find(p => p.id === activePopupPinId);
                    if (activePin && activePin.isSpecial) {
                        closeCurrentPopup(true);
                    }
                    if (map.hasLayer(specialPinsLayerGroup)) map.removeLayer(specialPinsLayerGroup);
                }
            } else if (layerKey === 'boundary') {
                if (layersState.boundary) {
                    if (!map.hasLayer(boundaryPolygonLayer)) boundaryPolygonLayer.addTo(map);
                } else {
                    if (map.hasLayer(boundaryPolygonLayer)) map.removeLayer(boundaryPolygonLayer);
                }
            } else if (layerKey === 'allMemories') {
                renderAllPins(false);
                renderActiveScreenLinks();
            }

            updateLayersUI();
            updateStatsUI();
        }

        function updateLayersUI() {
            let activeCount = 0;
            Object.keys(layersState).forEach(key => {
                const isOn = layersState[key];
                if (isOn) activeCount++;
                const sw = document.getElementById(`layerSwitch-${key}`);
                if (sw) {
                    if (isOn) sw.classList.add('is-on');
                    else sw.classList.remove('is-on');
                }
            });
            const badge = document.getElementById('activeLayersCountBadge');
            if (badge) badge.textContent = activeCount.toLocaleString('fa-IR');
        }

        function clearHoverNearestLink() {
            if (hoverNearestLinkLine && map) {
                map.removeLayer(hoverNearestLinkLine);
                hoverNearestLinkLine = null;
            }
        }

        function createScreenPinIcon(screenItem, isActive = false) {
            const activeClass = isActive ? 'active-screen-pin' : '';
            const linkedCount = getPinsForScreen(screenItem.id).length;

            return L.divIcon({
                className: 'custom-sketch-pin',
                iconSize: [28, 36],
                iconAnchor: [14, 34],
                popupAnchor: [0, 0],
                html: `
                    <div class="upright-counter-rotate">
                        <div class="screen-pin-wrapper ${activeClass}">
                            ${isActive ? `<div class="screen-active-ring"></div>` : ''}
                            ${linkedCount > 0 ? `<div class="screen-count-badge" title="${linkedCount.toLocaleString('fa-IR')} پین خاطره متصل به این اسکرین">${linkedCount.toLocaleString('fa-IR')}</div>` : ''}
                            <svg width="28" height="36" viewBox="0 0 36 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M18 44 C18 44 31.5 26.5 31.5 16 C31.5 8.2 25.5 2.5 18 2.5 C10.5 2.5 4.5 8.2 4.5 16 C4.5 26.5 18 44 18 44 Z" 
                                      fill="#0b1b45" stroke="#060e26" stroke-width="2.4" stroke-linejoin="round"/>
                                <path d="M18 42.5 C18 42.5 29.5 26 29.5 16 C29.5 9.2 24.4 4.2 18 4.2" 
                                      stroke="#4c6ef5" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
                                <circle cx="18" cy="15.5" r="4.8" fill="#ffffff" stroke="#060e26" stroke-width="2"/>
                            </svg>
                        </div>
                    </div>
                `
            });
        }

        function highlightActiveScreenMarker(activeId) {
            SCREEN_PINS_DATA.forEach(item => {
                const marker = screenMarkersMap[item.id];
                if (marker) {
                    marker.setIcon(createScreenPinIcon(item, item.id === activeId));
                }
            });
        }

        function renderScreenPins() {
            if (!screensLayerGroup) return;
            screensLayerGroup.clearLayers();
            screenMarkersMap = {};

            SCREEN_PINS_DATA.forEach(item => {
                const marker = L.marker([item.lat, item.lng], {
                    icon: createScreenPinIcon(item, item.id === selectedScreenId),
                    zIndexOffset: item.id === selectedScreenId ? 500 : 100
                }).addTo(screensLayerGroup);

                marker.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    if (isAddPinMode) {
                        if (isPointInsideStudyPolygon(item.lat, item.lng)) {
                            openNewPinCreationPopup(item.lat, item.lng);
                        }
                        return;
                    }
                    if (selectedScreenId === item.id) {
                        deselectScreen();
                    } else {
                        selectScreen(item.id, { animatePop: true, panToCluster: true });
                    }
                });

                screenMarkersMap[item.id] = marker;
            });

            if (layersState.screens && !map.hasLayer(screensLayerGroup)) {
                screensLayerGroup.addTo(map);
            }
            updateStatsUI();
        }

        function selectScreen(screenId, options = {}) {
            const screen = getScreenById(screenId);
            if (!screen) return;

            const { animatePop = true, keepPopup = false, panToCluster = false } = options;

            if (!keepPopup) {
                closeCurrentPopup(true);
            }

            if (!layersState.screens) {
                layersState.screens = true;
                if (!map.hasLayer(screensLayerGroup)) screensLayerGroup.addTo(map);
                updateLayersUI();
            }

            selectedScreenId = screen.id;
            highlightActiveScreenMarker(screen.id);
            renderAllPins(animatePop);
            renderActiveScreenLinks();
            updateActiveScreenBanner();

            const linkedPins = getPinsForScreen(screen.id);
            if (linkedPins.length === 0 && !tempDraftLatLng) {
                showToast(`Screen #${screen.index.toLocaleString('fa-IR')} انتخاب شد — هنوز خاطره‌ای نزدیک این اسکرین ثبت نشده است.`);
            } else if (panToCluster && linkedPins.length > 0) {
                const pts = [[screen.lat, screen.lng], ...linkedPins.map(p => [p.lat, p.lng])];
                const bounds = L.latLngBounds(pts);
                if (!map.getBounds().contains(bounds)) {
                    map.panTo(bounds.getCenter(), { animate: true, duration: 0.35 });
                }
            }
        }

        function deselectScreen() {
            closeCurrentPopup(true);
            selectedScreenId = null;
            tempDraftLatLng = null;
            highlightActiveScreenMarker(null);
            renderActiveScreenLinks();
            renderAllPins(false);
            updateActiveScreenBanner();
        }

        function renderActiveScreenLinks() {
            if (!activeScreenLinksLayerGroup) return;
            activeScreenLinksLayerGroup.clearLayers();

            if (!selectedScreenId) return;
            const screen = getScreenById(selectedScreenId);
            if (!screen) return;

            const linkedPins = getPinsForScreen(selectedScreenId);
            linkedPins.forEach(pin => {
                L.polyline(
                    [[screen.lat, screen.lng], [pin.lat, pin.lng]],
                    {
                        pane: 'cadLinksPane',
                        color: '#0b1b45',
                        weight: 1.6,
                        opacity: 0.72,
                        dashArray: '5, 5',
                        interactive: false
                    }
                ).addTo(activeScreenLinksLayerGroup);
            });

            if (tempDraftLatLng) {
                L.polyline(
                    [[screen.lat, screen.lng], [tempDraftLatLng.lat, tempDraftLatLng.lng]],
                    {
                        pane: 'cadLinksPane',
                        color: '#e53935',
                        weight: 2.1,
                        opacity: 0.88,
                        dashArray: '4, 4',
                        interactive: false
                    }
                ).addTo(activeScreenLinksLayerGroup);
            }
        }

        function updateActiveScreenBanner() {
            const banner = document.getElementById('activeScreenBanner');
            const titleEl = document.getElementById('activeScreenTitle');
            const countEl = document.getElementById('activeScreenCountText');
            if (!banner || !titleEl || !countEl) return;

            // Hide Screen info bar whenever a memory popup or new-memory form is open
            if (!selectedScreenId || isAddPinMode || activePopupPinId || currentPopup) {
                banner.classList.add('hidden');
                return;
            }

            const screen = getScreenById(selectedScreenId);
            if (!screen) {
                banner.classList.add('hidden');
                return;
            }

            const linkedPins = getPinsForScreen(selectedScreenId);
            titleEl.textContent = `Screen #${screen.index.toLocaleString('fa-IR')}`;
            if (linkedPins.length === 0) {
                countEl.textContent = 'هنوز خاطره‌ای به این اسکرین متصل نشده';
            } else {
                const memCount = linkedPins.reduce((acc, p) => acc + (p.memories ? p.memories.length : 0), 0);
                countEl.textContent = `${linkedPins.length.toLocaleString('fa-IR')} پین خاطره (${memCount.toLocaleString('fa-IR')} خاطره) نمایش داده شد`;
            }
            banner.classList.remove('hidden');
        }

        /***********************************************************************
         * 7. RED ARCHITECTURAL PIN, SPECIAL MEMORY PIN & ENLARGED SKETCH DIAGRAM
         ***********************************************************************/
        function createPinIcon(pinData, isActive = false, animatePop = false) {
            const count = pinData.memories ? pinData.memories.length : 1;
            const activeClass = isActive ? 'active-pin' : '';
            const popClass = animatePop ? 'pin-pop-in' : '';

            return L.divIcon({
                className: 'custom-sketch-pin',
                iconSize: [36, 46],
                iconAnchor: [18, 44],
                popupAnchor: [0, 0],
                html: `
                    <div class="upright-counter-rotate">
                        <div class="pin-svg-wrapper ${activeClass} ${popClass}">
                            ${count > 1 ? `<div class="pin-count-badge" title="${count.toLocaleString('fa-IR')} خاطره ثبت‌شده">${count.toLocaleString('fa-IR')}</div>` : ''}
                            <svg width="36" height="46" viewBox="0 0 36 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M18 44 C18 44 31.5 26.5 31.5 16 C31.5 8.2 25.5 2.5 18 2.5 C10.5 2.5 4.5 8.2 4.5 16 C4.5 26.5 18 44 18 44 Z" 
                                      fill="#e53935" stroke="#111111" stroke-width="2.3" stroke-linejoin="round"/>

        function renderSpecialPins() {
            if (!specialPinsLayerGroup) return;
            specialPinsLayerGroup.clearLayers();
            specialMarkersMap = {};

            const specialPins = getSpecialPins();
            specialPins.forEach(pin => {
                const marker = L.marker([pin.lat, pin.lng], {
                    icon: createSpecialPinIcon(pin, pin.id === activePopupPinId),
                    zIndexOffset: pin.id === activePopupPinId ? 750 : 450
                }).addTo(specialPinsLayerGroup);

                marker.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    if (isAddPinMode) {
                        if (isPointInsideStudyPolygon(pin.lat, pin.lng)) {
                            openNewPinCreationPopup(pin.lat, pin.lng);
                        }
                        return;
                    }
                    openPinDiagramPopup(pin.id);
                });

                specialMarkersMap[pin.id] = marker;
            });

            if (layersState.specialMemories && !map.hasLayer(specialPinsLayerGroup)) {
                specialPinsLayerGroup.addTo(map);
            }
            updateStatsUI();
        }

        function highlightActivePinMarker(activeId) {
            pinsData.forEach(pin => {
                if (pin.isSpecial) {
                    const sm = specialMarkersMap[pin.id];
                    if (sm) {
                        sm.setIcon(createSpecialPinIcon(pin, pin.id === activeId));
                    }
                } else {
                    const marker = markersMap[pin.id];
                    if (marker) {
                        marker.setIcon(createPinIcon(pin, pin.id === activeId, false));
                    }
                }
            });
        }

        function getDiagramPopupConfig() {
            const isMobile = window.innerWidth < 540;
            const stackWidth = isMobile ? Math.min(Math.round(window.innerWidth * 0.8), 350) : 410;
            const totalWidth = stackWidth + 54;
            return {
                offset: [Math.round(totalWidth / 2), 0],
                maxWidth: totalWidth + 24,
                minWidth: Math.min(totalWidth, window.innerWidth - 20)
            };
        }

        function attachPopupScrollAndViewportFit(popupInstance) {
            const el = popupInstance && popupInstance.getElement ? popupInstance.getElement() : null;
            if (!el) return;

            // Allow smooth vertical scrolling inside the memory card without zooming/dragging the map
            L.DomEvent.disableScrollPropagation(el);
            L.DomEvent.disableClickPropagation(el);

            const stackEl = el.querySelector('.sketch-boxes-stack');
            if (stackEl) {
                stackEl.addEventListener('wheel', (e) => e.stopPropagation(), { passive: true });
                stackEl.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
                stackEl.addEventListener('touchmove', (e) => e.stopPropagation(), { passive: true });
            }

            // Ensure the entire popup fits safely below the top header and inside the viewport
            requestAnimationFrame(() => {
                const boxEl = el.querySelector('.sketch-boxes-stack') || el;
                const rect = boxEl.getBoundingClientRect();
                const header = document.querySelector('header');
                const headerBottom = header ? header.getBoundingClientRect().bottom : 86;

                const safeTop = Math.min(headerBottom + 16, window.innerHeight * 0.30);
                const safeBottom = window.innerHeight - 24;
                const safeLeft = 16;
                const safeRight = window.innerWidth - 16;

                let screenDx = 0;
                let screenDy = 0;

                if (rect.top < safeTop) {
                    screenDy = rect.top - safeTop;
                } else if (rect.bottom > safeBottom) {
                    screenDy = rect.bottom - safeBottom;
                }

                if (rect.left < safeLeft) {
                    screenDx = rect.left - safeLeft;
                } else if (rect.right > safeRight) {
                    screenDx = rect.right - safeRight;
                }

                if (Math.abs(screenDx) > 2 || Math.abs(screenDy) > 2) {
                    // Compensate for the -5.5 deg CSS rotation on #map
                    const rad = 5.5 * Math.PI / 180;
                    const mapDx = Math.round(screenDx * Math.cos(rad) - screenDy * Math.sin(rad));
                    const mapDy = Math.round(screenDx * Math.sin(rad) + screenDy * Math.cos(rad));
                    map.panBy([mapDx, mapDy], { animate: true, duration: 0.32 });
                }
            });
        }

                    <div class="sketch-boxes-stack">

                                    ${isSpecial ? `

                                            خاطره خاص

                                    ` : (linkedScreen ? `

                                            Screen #${linkedScreen.index.toLocaleString('fa-IR')}

                                    <button onclick="closeCurrentPopup(true)" 
                                        class="text-neutral-400 hover:text-black text-sm font-extrabold px-1 cursor-pointer"
                                        title="بستن">✕</button>
                                </div>
                            </div>

                            <div class="flex items-center justify-between text-xs font-bold text-neutral-600 mb-1.5">
                                <span class="text-black">${escapeHtml(primary.author || 'شهروند تهران')}</span>
                                <span>${escapeHtml(primary.date || '')}</span>
                            </div>

                            <p class="text-sm text-black leading-7 font-medium">
                                ${escapeHtml(primary.text)}
                            </p>

                            <svg class="sketch-wavy-divider" viewBox="0 0 200 6" fill="none">
                                <path d="M2 3 Q 30 0.5, 60 3.5 T 120 2.5 T 198 3" stroke="${accentStroke}" stroke-width="1.5" stroke-linecap="round"/>

                        <!-- 2. STACKED BLACK RECTANGULAR BOXES UNDERNEATH -->
                        ${secondaryMemories.length > 0 ? `

                        <!-- 3. BOTTOM BLACK BOX: Add another memory to this pin's stack -->
                        <div class="sketch-box-black bg-neutral-50">

        function renderAllPins(animatePop = false) {
            if (!memoryPinsLayerGroup) return;
            memoryPinsLayerGroup.clearLayers();
            markersMap = {};

            // Only show regular memories belonging to the selected Screen (unless "نمایش همه خاطرات" is toggled on)
            let visiblePins = [];
            if (layersState.allMemories) {
                visiblePins = getRegularPins();
            } else if (selectedScreenId) {
                visiblePins = getPinsForScreen(selectedScreenId);
            }

            visiblePins.forEach(pin => {
                const marker = L.marker([pin.lat, pin.lng], {
                    icon: createPinIcon(pin, pin.id === activePopupPinId, animatePop),
                    zIndexOffset: pin.id === activePopupPinId ? 600 : 300
                }).addTo(memoryPinsLayerGroup);

                marker.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    openPinDiagramPopup(pin.id);
                });

                markersMap[pin.id] = marker;
            });

            updateStatsUI();
        }

        function openPinDiagramPopup(pinId) {
            const pin = pinsData.find(p => p.id === pinId);
            if (!pin) return;

            closeCurrentPopup(true);

            // For regular memories, ensure parent Screen is selected so sibling memories & links stay visible
            if (!pin.isSpecial && pin.screenId && selectedScreenId !== pin.screenId) {
                selectedScreenId = pin.screenId;
                highlightActiveScreenMarker(pin.screenId);
                renderAllPins(false);
                renderActiveScreenLinks();
            }

            activePopupPinId = pin.id;
            highlightActivePinMarker(pin.id);

            const popupCfg = getDiagramPopupConfig();

            currentPopup = L.popup({
                className: 'diagram-popup',
                closeButton: false,
                autoClose: false,
                closeOnClick: false,
                offset: popupCfg.offset,
                maxWidth: popupCfg.maxWidth,
                minWidth: popupCfg.minWidth
            })
                .setLatLng([pin.lat, pin.lng])
                .setContent(`<div class="diagram-popup-anchor">${buildDiagramPopupHTML(pin)}</div>`)
                .openOn(map);

            // Immediately hide Screen info bar so it never overlaps the memory popup
            updateActiveScreenBanner();
            attachPopupScrollAndViewportFit(currentPopup);
        }

        /***********************************************************************
         * 8. ADDING NEW PINS & MEMORIES INTERACTION
         ***********************************************************************/
        function toggleAddPinMode(forceState) {
            isAddPinMode = typeof forceState === 'boolean' ? forceState : !isAddPinMode;
            const btn = document.getElementById('toggleAddPinBtn');
            const btnText = document.getElementById('addPinBtnText');
            const banner = document.getElementById('modeInstructionBanner');

            if (isAddPinMode) {
                document.body.classList.add('adding-pin-cursor');
                btn.classList.add('active-mode');
                btnText.textContent = 'در حال انتخاب نقطه روی نقشه... (لغو)';
                banner.classList.remove('opacity-0', '-translate-y-2');
                banner.classList.add('opacity-100', 'translate-y-0');
                closeCurrentPopup(true);
            } else {
                document.body.classList.remove('adding-pin-cursor');
                btn.classList.remove('active-mode');
                btnText.textContent = '+ گذاشتن پین و ثبت خاطره';
                banner.classList.add('opacity-0', '-translate-y-2');
                banner.classList.remove('opacity-100', 'translate-y-0');
                clearHoverNearestLink();
            }
            updateActiveScreenBanner();
        }

        function openNewPinCreationPopup(lat, lng) {
            closeCurrentPopup(true);
            clearHoverNearestLink();

            const nearest = findNearestScreen(lat, lng);
            const targetScreen = nearest.screen;
            const siblingCount = getPinsForScreen(targetScreen.id).length;

            // Automatically activate nearest Screen so sibling memories under that Screen appear immediately
            tempDraftLatLng = { lat, lng };
            selectedScreenId = targetScreen.id;
            if (!layersState.screens) {
                layersState.screens = true;
                if (!map.hasLayer(screensLayerGroup)) screensLayerGroup.addTo(map);
                updateLayersUI();
            }
            highlightActiveScreenMarker(targetScreen.id);
            renderAllPins(true);
            renderActiveScreenLinks();
            updateActiveScreenBanner();

            tempNewMarker = L.marker([lat, lng], {
                icon: createPinIcon({ memories: [1] }, true, true),
                zIndexOffset: 700
            }).addTo(map);

            const siblingHint = siblingCount > 0
                ? `${siblingCount.toLocaleString('fa-IR')} خاطره دیگر زیرمجموعه این اسکرین روی نقشه ظاهر شد`
                : 'این اولین خاطره زیرمجموعه این اسکرین خواهد بود';

            const formHTML = `
                <div class="diagram-popup-anchor">
                    <div class="sketch-diagram-container" onclick="event.stopPropagation()">
                        <svg class="sketch-connector-svg" viewBox="0 0 54 64" fill="none">
                            <line x1="0" y1="52" x2="54" y2="1.5" stroke="#e53935" stroke-width="3" stroke-linecap="round" />
                            <circle cx="0" cy="52" r="3.2" fill="#e53935" />
                        </svg>

                        <div class="sketch-boxes-stack">
                            <div class="sketch-box-red">
                                <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-red-200">
                                    <span class="text-sm font-extrabold text-red-600">📌 ثبت پین و خاطره جدید</span>
                                    <button type="button" onclick="cancelNewPinCreation()" class="text-neutral-400 hover:text-black text-sm font-bold px-1 cursor-pointer">✕</button>
                                </div>

                                <div class="mb-2.5 px-2.5 py-2 text-xs border border-[#0b1b45] bg-[#f4f6fc]">
                                    <div class="flex items-center justify-between font-extrabold" style="color: #0b1b45;">
                                        <span>🔗 متصل به نزدیک‌ترین اسکرین: Screen #${targetScreen.index.toLocaleString('fa-IR')}</span>
                                        <span>~${nearest.distanceMeters.toLocaleString('fa-IR')} متر</span>
                                    </div>
                                    <div class="text-[11px] text-neutral-600 mt-1 font-medium">${siblingHint}</div>
                                </div>

                                <form onsubmit="saveNewPinFromPopup(event, ${lat}, ${lng}, '${targetScreen.id}')" class="space-y-2.5">
                                    <div>
                                        <label class="block text-xs font-bold text-neutral-700 mb-1">عنوان محل یا کوچه:</label>
                                        <input type="text" id="newPinLocationTitle" required placeholder="مثلاً: تقاطع ولیعصر و بزرگمهر"
                                            class="w-full text-sm px-2.5 py-2 border border-black bg-white focus:outline-none focus:border-red-600" />
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-neutral-700 mb-1">نام شما (یا لقب):</label>
                                        <input type="text" id="newPinAuthor" placeholder="مثلاً: یک شهروند تهرانی"
                                            class="w-full text-sm px-2.5 py-2 border border-black bg-white focus:outline-none focus:border-red-600" />
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-neutral-700 mb-1">متن خاطره:</label>
                                        <textarea id="newPinText" rows="4" required placeholder="خاطره خود را از این خیابان یا ساختمان بنویسید..."
                                            class="w-full text-sm px-2.5 py-2 border border-black bg-white focus:outline-none focus:border-red-600 leading-relaxed"></textarea>
                                    </div>
                                    <div class="flex items-center justify-end gap-2 pt-1">
                                        <button type="button" onclick="cancelNewPinCreation()"
                                            class="px-3 py-1.5 text-xs font-bold border border-black bg-white hover:bg-neutral-100 cursor-pointer">
                                            انصراف
                                        </button>
                                        <button type="submit"
                                            class="px-4 py-1.5 text-xs font-bold bg-red-600 text-white border border-black hover:bg-red-700 cursor-pointer">

                                        </button>

            const popupCfg = getDiagramPopupConfig();
