                className: 'diagram-popup',
                closeButton: false,
                autoClose: false,
                closeOnClick: false,
                offset: popupCfg.offset,
                maxWidth: popupCfg.maxWidth,
                minWidth: popupCfg.minWidth
            })
                .setLatLng([lat, lng])
                .setContent(formHTML)
                .openOn(map);

            updateActiveScreenBanner();
            attachPopupScrollAndViewportFit(currentPopup);

            setTimeout(() => {
                const titleInput = document.getElementById('newPinLocationTitle');
                if (titleInput) titleInput.focus();
            }, 120);
        }

        function cancelNewPinCreation() {
            closeCurrentPopup(true);
            renderActiveScreenLinks();
        }

        function saveNewPinFromPopup(event, lat, lng, linkedScreenId) {
            event.preventDefault();
            const locationTitle = document.getElementById('newPinLocationTitle').value.trim() || 'نقطه‌ای در مرکز تهران';
            const author = document.getElementById('newPinAuthor').value.trim() || 'شهروند تهران';
            const text = document.getElementById('newPinText').value.trim();

            if (!text) return;

            const nearest = findNearestScreen(lat, lng);
            const finalScreenId = linkedScreenId || nearest.screen.id;
            const targetScreen = getScreenById(finalScreenId) || nearest.screen;

            const newPin = {
                id: 'pin-' + Date.now(),
                lat: lat,
                lng: lng,
                screenId: targetScreen.id,
                locationTitle: locationTitle,
                isUserCreated: true,
                memories: [
                    {
                        author: author,
                        date: 'ثبت‌شده توسط شما',
                        text: text
                    }
                ]
            };

            closeCurrentPopup(true);
            pinsData.push(newPin);
            savePinsToStorage();
            toggleAddPinMode(false);

            selectedScreenId = targetScreen.id;
            renderScreenPins();
            renderAllPins(false);
            renderActiveScreenLinks();
            updateActiveScreenBanner();

            openPinDiagramPopup(newPin.id);

            showToast(`خاطره شما ثبت و به نزدیک‌ترین اسکرین (Screen #${targetScreen.index.toLocaleString('fa-IR')}) متصل شد.`);
        }

        function showAddMemoryToPinForm(pinId) {
            const trigger = document.getElementById(`addMemoryTrigger-${pinId}`);
            const form = document.getElementById(`addMemoryForm-${pinId}`);
            if (trigger && form) {
                trigger.classList.add('hidden');
                form.classList.remove('hidden');
                const stackEl = form.closest('.sketch-boxes-stack');
                if (stackEl) {
                    setTimeout(() => {
                        stackEl.scrollTo({ top: stackEl.scrollHeight, behavior: 'smooth' });
                    }, 40);
                }
                const textarea = document.getElementById(`memText-${pinId}`);
                if (textarea) textarea.focus();
            }
        }

        function hideAddMemoryToPinForm(pinId) {
            const trigger = document.getElementById(`addMemoryTrigger-${pinId}`);
            const form = document.getElementById(`addMemoryForm-${pinId}`);
            if (trigger && form) {
                form.classList.add('hidden');
                trigger.classList.remove('hidden');
            }
        }

        function submitMemoryToExistingPin(event, pinId) {
            event.preventDefault();
            const authorInput = document.getElementById(`memAuthor-${pinId}`);
            const textInput = document.getElementById(`memText-${pinId}`);
            if (!textInput || !textInput.value.trim()) return;

            const pin = pinsData.find(p => p.id === pinId);
            if (!pin) return;

            pin.memories.push({
                author: (authorInput && authorInput.value.trim()) ? authorInput.value.trim() : 'شهروند تهران',
                date: 'ثبت جدید',
                text: textInput.value.trim()
            });

            savePinsToStorage();
            if (pin.isSpecial) {
                renderSpecialPins();
            } else {
                renderAllPins(false);
            }
            openPinDiagramPopup(pinId);
            showToast('خاطره جدید به لیست این پین اضافه شد.');
        }

        function deletePin(pinId) {
            pinsData = pinsData.filter(p => p.id !== pinId);
            savePinsToStorage();
            closeCurrentPopup(true);
            renderScreenPins();
            renderAllPins(false);
            renderActiveScreenLinks();
            updateActiveScreenBanner();
            showToast('پین مورد نظر حذف شد.');
        }

        function resetToDemoMemories() {
            pinsData = ensurePinsLinkedToNearestScreen(JSON.parse(JSON.stringify(DEFAULT_DEMO_PINS)));
            savePinsToStorage();
            deselectScreen();
            renderScreenPins();
            renderSpecialPins();
            recenterMap();
            showToast('خاطرات دمو و خاطرات خاص به حالت اولیه بازگردانی شدند.');
        }

        function closeCurrentPopup(keepScreenSelection = true) {
            if (currentPopup) {
                map.removeLayer(currentPopup);
                currentPopup = null;
            }
            if (tempNewMarker) {
                map.removeLayer(tempNewMarker);
                tempNewMarker = null;
            }
            tempDraftLatLng = null;
            activePopupPinId = null;
            highlightActivePinMarker(null);

            if (!keepScreenSelection) {
                selectedScreenId = null;
                highlightActiveScreenMarker(null);
                renderAllPins(false);
            }
            renderActiveScreenLinks();
            updateActiveScreenBanner();
        }

        // Close Layers panel when clicking outside
        document.addEventListener('click', (e) => {
            if (!isLayersPanelOpen) return;
            const wrapper = document.getElementById('layersControlWrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                toggleLayersPanel(null, false);
            }
        });

        function recenterMap() {
            fitMapToScreenshotFrame(true);
        }

        function showToast(message) {
            const box = document.getElementById('toastBox');
            const text = document.getElementById('toastText');
            if (!box || !text) return;
            text.textContent = message;
            box.classList.remove('opacity-0');
            box.classList.add('opacity-100');
            setTimeout(() => {
                box.classList.remove('opacity-100');
                box.classList.add('opacity-0');
            }, 2800);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.onload = function() {
            initMap();
        };
    </script>
</body>
</html>
